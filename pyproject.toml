[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mkp"
version = "0.0.1"
description = "MKP simulation system"
requires-python = ">=3.11"

[project.entry-points.pytest11]
mkp_invocation_tests = "mkp.pytest_plugin"

# 原始碼在倉庫根目錄，匯入名稱仍為 `mkp`（見 package-dir）
[tool.setuptools]
package-dir = { "mkp" = "." }
packages = [
    "mkp",
    "mkp.cli",
    "mkp.cli.convert",
    "mkp.cli.run",
    "mkp.converter",
    "mkp.engine",
    "mkp.simulator",
    "mkp.solver",
    "mkp.tools",
    "mkp.valid",
]
