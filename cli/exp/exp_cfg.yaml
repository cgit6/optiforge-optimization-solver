experiment_name: mkp_final_compare
collects: 20
repeat: 300000000000

solvers:
  - solver: bsma_numba
    param_idx: [7]
  - solver: bsca_numba
    param_idx: [6]
  - solver: brlsmasca_rl_numba
    param_idx: [23]
  - solver: brlsmasca_test_numba
    param_idx: [8]

dataset_settings:
  - experiment-id: set1_sent
    dataset: SENT
    type: mkp
    problems:
      - problem: sent01
        evaluation: [mkp_base, mkp_base2, mkp_bsca_base_margin_2]
        base_line:
          - name: HLMS
            Pdev: 0.129
