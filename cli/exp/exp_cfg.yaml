
# 實驗設定
experiment_name: literature_mkp_seed_search
seed: [1, 1000000] # 隨機種子範圍
collects: 20 # 收集幾組符合期望的結果
worker: 10 # 併發數
solvers: [
  bsma_numba_transfer_literature,
  bsca_numba_transfer_literature,
  brlsmasca_numba_transfer_literature,
  brlsmasca_numba_random50_transfer_literature,
  bsma_numba_literature,
  bsca_numba_literature,
  brlsmasca_numba_literature,
  brlsmasca_numba_random50_literature
] # transfer + calibration/final presets
repeat: 20 # 重複次數

# 題庫設定
# 實驗會依 paper_set 逐組驗證文獻結論
dataset_settings:
  - experiment-id: sent-expTest
    dataset: SENT
    problems: [sent01, sent02]
    type: mkp
    paper_set: set1
    evaluation:
      name: literature_mkp_support_full
      config: {}

  - experiment-id: hp-expTest
    dataset: HP
    problems: [hp1, hp2]
    type: mkp
    paper_set: set1
    evaluation:
      name: literature_mkp_support_full
      config: {}

