
# 實驗設定
experiment_name: literature_mkp_seed_search
seed: [1, 1000000] # 隨機種子範圍
collects: 20 # 收集幾組符合期望的結果
worker: 10 # 併發數
solvers: [bsma_numba, bsca_numba, brlsmasca_numba] # 要執行的演算法
repeat: 20 # 重複次數

# 題庫設定
# 實驗會依序執行
dataset_settings:
  - experiment-id: weish-expTest
    dataset: WEISH
    problems: [weish01, weish02, weish03, weish04, weish05, weish06, weish07, weish08, weish09, weish10, weish11, weish12, weish13, weish14, weish15, weish16, weish17, weish18, weish19, weish20, weish21, weish22, weish23, weish24, weish25, weish26, weish27, weish28, weish29, weish30]
    type: mkp
    evaluation:
      name: literature_mkp
      base_line:
        - name: HLMS
          Pdev: 0.154
        - name: BIWOA
          Pdev: 0.472
        - name: BMMVO
          Pdev: 0.861
        - name: BSCA
          Pdev: 0.314
        - name: IBSMA_U1
          Pdev: 0.105

  - experiment-id: weing-expTest
    dataset: WEING
    problems: [weing1, weing2, weing3, weing4, weing5, weing6, weing7, weing8]
