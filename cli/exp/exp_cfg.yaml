# 實驗設定
experiment_name: mkp_test_now
collects: 20
repeat: 1000000

# 要執行的演算法，以及算法參數索引值
solvers:
  - solver: bsma_numba
    param_idx: [0]
  - solver: bsca_numba
    param_idx: [0]
  - solver: brlsmasca_numba
    param_idx: [0]

# 題庫設定
# 實驗會依序執行 dataset，再依序執行 problem。
dataset_settings:
  - experiment-id: weish
    dataset: WEISH
    type: mkp
    problems:
      - problem: weish01
        evaluation: [mkp_base, mkp_base2]
        base_line:
