# 參數實驗
experiment_name: mkp_transfer_param

collects: 100
repeat: 300000000000 # 重複次數上限

solvers:
  - solver: bsma_numba
    param_idx: [0, 1, 2, 3, 4, 5, 6, 7, 8]
  - solver: bsca_numba
    param_idx: [0, 1, 2, 3, 4, 5, 6, 7, 8]
