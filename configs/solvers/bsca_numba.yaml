solver_id: bsca_numba
solver_class: BSCANumbaSolver
capabilities:
  problem_types: [mkp]
  encodings: [binary]
  directions: [max]
stop_condition:
  type: max_iterations
  max_iterations: 1000
  max_seconds: null
params:
  - pop_size: 20
    a: 2.0
    # 選填：ctf 與 bsca 相同；省略時 tanh_abs
    ctf: tanh_abs
  - pop_size: 20
    a: 1.5
    # 選填：ctf 與 bsca 相同；省略時 tanh_abs
    ctf: tanh_abs
  - pop_size: 20
    a: 2.5
    # 選填：ctf 與 bsca 相同；省略時 tanh_abs
    ctf: tanh_abs
