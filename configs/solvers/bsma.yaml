# (必填) 求解器 ID
solver_id: bsma
# 求解器類別
solver_class: BSMASolver
# 求解屬性
capabilities:
  problem_types: [mkp]
  encodings: [binary]
  directions: [max]
# (必填)停止條件
stop_condition:
  type: max_iterations
  max_iterations: 1000 # 最大迭代次數
  max_seconds: null

# 自訂義參數
params:
  - pop_size: 20 # 種群大小
    z: 0.08 # 轉換機率
    # 選填：連續基因 → 二元判斷之比較函數（見 mkp.tools.continuous_to_binary.CTF_KINDS）；省略時等同 tanh_abs
    ctf: tanh_abs
  - pop_size: 20
    z: 0.03
    ctf: sigmoid_s0
  - pop_size: 20
    z: 0.15
    ctf: abs_pow_17

